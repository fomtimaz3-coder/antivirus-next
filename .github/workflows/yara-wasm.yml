name: Build YARA WASM
on:
  push:
    paths: ['native/**', '.github/workflows/yara-wasm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y automake libtool pkg-config flex bison
      - name: Install pinned Emscripten
        run: |
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64
      - name: Compile libyara 4.5.8
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          git clone --depth 1 --branch v4.5.8 https://github.com/VirusTotal/yara.git "$RUNNER_TEMP/yara"
          cd "$RUNNER_TEMP/yara"
          ./bootstrap.sh
          emconfigure ./configure --host=wasm32-unknown-emscripten --disable-shared --disable-crypto --without-crypto --disable-magic --disable-cuckoo --disable-dotnet
          emmake make -j2
          mkdir -p "$GITHUB_WORKSPACE/vendor"
          emcc "$GITHUB_WORKSPACE/native/yara-wrapper.c" libyara/.libs/libyara.a -Ilibyara/include -O2 -sMODULARIZE=1 -sEXPORT_ES6=1 -sENVIRONMENT=web,worker,node -sALLOW_MEMORY_GROWTH=1 -sMAXIMUM_MEMORY=134217728 -sFILESYSTEM=0 -sEXPORTED_FUNCTIONS='["_aw_scan","_aw_result","_malloc","_free"]' -sEXPORTED_RUNTIME_METHODS='["ccall","UTF8ToString"]' -o "$GITHUB_WORKSPACE/vendor/yara.js"
          cp COPYING "$GITHUB_WORKSPACE/vendor/YARA-LICENSE"
      - name: Smoke test
        run: node native/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: yara-4.5.8-wasm
          path: vendor/
